<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>條目・台日新辭書線上版</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>
<header class="top">
  <a class="title" href="index.html"><img class="sitelogo" src="assets/logo.png" alt="做工仔人台語工作室">台日新辭書線上版</a>
  <nav><a href="index.html">搜尋</a><a href="revisions.html">修訂紀錄</a><a href="about.html">關於</a></nav>
</header>
<main id="entry"><p class="pending">載入中…</p></main>

<div id="lightbox"><img src="" alt="書影放大"></div>

<!-- C332（M050 場 3 之 1）：統一對話框。四顆區塊鈕都開這一個框，類別依按鈕預選、可改
     （定案 §二 9）；類別決定拉校對的 cls。團隊模式多一類「批注草稿」、暱稱欄隱藏。
     Turnstile：團隊免驗；widget 載不起來或驗不過照樣送得出去，伺服器端只標記（feedback.js）。 -->
<div id="reportbox">
  <div class="panel">
    <h2>回報與留言</h2>
    <p class="src" id="reportctx"></p>
    <fieldset id="reportcat" class="rcats">
      <legend class="src">類別（已依按鈕預選，可改）</legend>
      <label><input type="radio" name="rcat" value="表頭"> 表頭</label>
      <label><input type="radio" name="rcat" value="原冊改錯字"> 原冊改錯字</label>
      <label><input type="radio" name="rcat" value="翻譯意見"> 翻譯意見</label>
      <label><input type="radio" name="rcat" value="留言"> 留言補充</label>
      <label class="teamonly"><input type="radio" name="rcat" value="批注"> 批注草稿</label>
    </fieldset>
    <div id="rfix" class="rpane">
      <label class="src">原文 → 應為（選填）</label>
      <div class="edrow"><input id="rbefore" type="text" maxlength="200" placeholder="原文">
        <span>→</span><input id="rafter" type="text" maxlength="200" placeholder="應為"></div>
    </div>
    <div id="rann" class="rpane">
      <p class="src" id="rannpath"></p>
      <div class="edrow">
        <label class="src">引文（選取的文字）<input id="rannquote" type="text" maxlength="200"></label>
        <label class="src">性質 <select id="rannkind"></select></label>
      </div>
    </div>
    <textarea id="reporttext" placeholder="請描述問題（哪個字、哪個注音／翻譯有誤，正確應為…）"></textarea>
    <p class="src warn" id="rcathint"></p>
    <div id="rnamebox">
      <label class="src">暱稱（選填，將會顯示在公開的修訂記錄與留言頁中）</label>
      <input id="reportname" type="text" maxlength="60" placeholder="例：阿明">
    </div>
    <div id="rturnstile"></div>
    <div class="actions">
      <button id="reportcancel">取消</button>
      <button id="reportsend" class="primary">送出</button>
    </div>
  </div>
</div>

<!-- C324（M050 場 2 之 3）：團隊模式的校對修正框。三種編輯器共用一個框，
     由 entry.js 的 describeSlot() 依「雙擊到哪一格」決定顯示哪一面：
       editsyl ＝音節編輯器（假名／調號／鼻音／送氣＋POJ 即時換算）
       editleaf＝文字葉編輯器（整葉值＋符號鈕）
       editsep ＝head.sep[i] 切換鈕（無／--／|）
       editdesc＝描述模式（產不出機器可讀改法時的正常出口，不是失敗）
     C338（U116，站主 M053 補函第 5 條）：
       editwhole＝整葉注音編輯器（釋義／例句台文／例句日文：整葉文字＋注音清單一筆送出） -->
<div id="editbox">
  <div class="panel">
    <h2>校對修正</h2>
    <p class="src" id="editctx"></p>

    <div id="editsyl" class="edpane">
      <label class="src">假名（片假名；· ＝送氣記號照印）</label>
      <input id="edkana" type="text" maxlength="16" autocomplete="off" spellcheck="false">
      <div class="edrow">
        <label class="src">調號
          <select id="edtone">
            <option value="">（空）</option>
            <option>1</option><option>2</option><option>3</option><option>4</option>
            <option>5</option><option>7</option><option>8</option>
          </select>
        </label>
        <label class="src"><input id="ednasal" type="checkbox"> 鼻音</label>
        <label class="src"><input id="edasp" type="checkbox"> 送氣</label>
      </div>
      <label class="src">POJ（打這一欄會即時換算成假名）</label>
      <input id="edpoj" type="text" maxlength="24" autocomplete="off" spellcheck="false">
      <p class="src" id="edprev"></p>
    </div>

    <div id="editleaf" class="edpane">
      <label class="src">原值（<span id="editleaflab">整葉值</span>）</label>
      <textarea id="editorig" readonly></textarea>
      <label class="src">修正值</label>
      <textarea id="editnew"></textarea>
      <div id="edsyms" class="edsyms"></div>
    </div>

    <div id="editwhole" class="edpane">
      <p class="src">整葉＝這一欄的文字連同注音一起改、一次送出。沒注音的字直接打字增刪改；
        帶注音的字是一整塊（藍底），刪、搬時注音跟著走。雙擊一塊改字、改注音、合併或拆開；
        選取幾個沒注音的字可「加注音」。</p>
      <div id="edwtext" class="edwtext" contenteditable="true" spellcheck="false"></div>
      <div class="edrow">
        <button type="button" id="edwadd">選取處加注音</button>
        <span class="src" id="edwstat"></span>
      </div>
      <div id="edwgone" class="edwgone"></div>
      <div id="edwlost" class="edwlost"></div>
      <div id="edwblk" class="edwblk">
        <div class="edrow">
          <label class="src">字 <input id="edwc" type="text" maxlength="12" autocomplete="off" spellcheck="false"></label>
          <label class="src">注音（片假名） <input id="edwk" type="text" maxlength="16" autocomplete="off" spellcheck="false"></label>
        </div>
        <div class="edrow" id="edwtw">
          <label class="src">調號
            <select id="edwtone">
              <option value="">（空）</option>
              <option>1</option><option>2</option><option>3</option><option>4</option>
              <option>5</option><option>7</option><option>8</option>
            </select>
          </label>
          <label class="src"><input id="edwnasal" type="checkbox"> 鼻音</label>
          <label class="src"><input id="edwasp" type="checkbox"> 送氣</label>
        </div>
        <div class="edrow">
          <button type="button" id="edwok">套用</button>
          <button type="button" id="edwdel">刪除此詞塊</button>
          <button type="button" id="edwmerge">與後一塊合併</button>
        </div>
        <div class="edrow">
          <label class="src">拆開：第 <input id="edwcut" type="number" min="1" value="1"> 字之後；
            前半注音用上面那格，後半注音 <input id="edwk2" type="text" maxlength="16" autocomplete="off" spellcheck="false"></label>
          <button type="button" id="edwsplit">拆開</button>
        </div>
      </div>
    </div>

    <div id="editsep" class="edpane">
      <label class="src">音節之間（<code>--</code>＝輕聲、<code>|</code>＝詞界、無＝一般連寫）</label>
      <p class="src" id="edsepnow"></p>
      <div class="edrow" id="edsepbtns"></div>
    </div>

    <div id="editdesc" class="edpane">
      <p class="src" id="editwhy"></p>
      <label class="src">說明（哪個字、哪裡不對，正確應為…）</label>
      <textarea id="editdesctext"></textarea>
    </div>

    <fieldset id="editfix">
      <legend class="src">這一筆是哪一種（必選）</legend>
      <label><input type="radio" name="edfix" value="數位化打錯"> 數位化打錯</label>
      <label><input type="radio" name="edfix" value="原書印面本身有誤"> 原書印面本身有誤</label>
    </fieldset>

    <label class="src">備註（判讀依據、頁面位置等）</label>
    <textarea id="editnote" placeholder="例：原冊 15x 放大可見鼻音圈"></textarea>
    <p class="src warn" id="edithint"></p>
    <div class="actions">
      <button id="editannot" type="button" title="不是改值、是要加一則編者按：轉成批注草稿（錨點＝這一欄）">改寫批注草稿</button>
      <button id="editcancel">取消</button>
      <button id="editsend" class="primary">送出</button>
    </div>
  </div>
</div>

</footer>
<!-- C324：音節編輯器要用 `parsePoj`／`pojToKana`／`kanaToPoj`（定案 §四 場 2 之 3 明訂
     不另寫轉換器）。本頁原本只載 entry.js——引擎只掛在 index.html 上，於是那三支在
     條目頁是 undefined。順序：引擎在前、entry.js 在後。
     `publish_from_windows.py` 的受管清單本來就含這支，發布面零改動。 -->
<script src="assets/poj_converter.js"></script>
<!-- C332：Turnstile。Site Key 是公開值（`docs/清單_Cloudflare三件設定…` §三之七）；放行網域只有
     taijit-sinsusu.pages.dev ⇒ 在 localhost 會報 110200「Domain not authorized」＝設計內的假失敗
     （清單 §3.5），對話框照樣送得出去。`render=explicit`：開對話框才渲染、團隊模式不渲染。 -->
<script>window.TURNSTILE_SITEKEY = '0x4AAAAAAFHS8iG4cdt1WHQ8';</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script src="assets/entry.js"></script>
</body>
