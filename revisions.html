<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>修訂紀錄・台日新辭書線上版</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  .revtable-wrap { overflow-x: auto; }
  table.revtable { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 900px; table-layout: fixed; }
  table.revtable th, table.revtable td {
    border-bottom: 1px solid var(--line); padding: 8px 10px;
    text-align: left; vertical-align: top; overflow-wrap: break-word;
  }
  table.revtable th {
    color: var(--sub); font-size: 13px; letter-spacing: .08em;
    border-bottom: 2px solid var(--line); white-space: nowrap;
  }
  table.revtable td.nowrap { white-space: nowrap; }
  table.revtable .issue { color: var(--accent); }
  table.revtable .ai { color: var(--sub); }
  .actchip {
    font-size: 12px; color: #fff; background: var(--badge);
    border-radius: 4px; padding: 1px 8px; white-space: nowrap;
  }
  .actchip.keep { background: #a09484; }
</style>
</head>
<body>
<header class="top">
  <a class="title" href="index.html"><img class="sitelogo" src="assets/logo.png" alt="做工仔人台語工作室">台日新辭書線上版</a>
  <nav><a href="index.html">搜尋</a><a href="revisions.html">修訂紀錄</a><a href="about.html">關於</a></nav>
</header>
<main>
  <section class="card">
    <h2>修訂紀錄</h2>
    <p class="hint">使用者回報經查證後的處理結果，新到舊排列。感謝每一位回報者——你們的眼睛讓這部辭典更可靠。回報時間為台灣時間。</p>
    <div class="revtable-wrap">
      <table class="revtable">
        <colgroup>
          <col style="width:145px"><col style="width:120px"><col>
          <col style="width:96px"><col><col>
        </colgroup>
        <thead>
          <tr><th>回報時間</th><th>條目</th><th>回報內容</th><th>回報人</th><th>AI意見</th><th>修訂結果</th></tr>
        </thead>
        <tbody id="revbody"><tr><td colspan="6" class="pending">載入中…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>
<footer class="site">
  《臺日新辭書》東方孝義（1889–1957）著，臺灣警察協會 1931 年出版，著作權存續期間已屆滿（公有領域）。
  原冊圖檔來源：<a href="https://das.nlpi.edu.tw/" target="_blank" rel="noopener">國立公共資訊圖書館 數位典藏服務網</a>。<br>
  本站之數位化轉寫、中文翻譯與網站設計 © 2026
  <a href="https://cho-kang-a-lang.github.io/" target="_blank" rel="noopener">做工仔人台語工作室</a>，保留所有權利。
</footer>
<script>
'use strict';
const ACT = { 'engine-fix': '引擎修正', 'data-fix': '資料修正', 'ed-overlay': '校訂註記',
              'site-fix': '網站修正', 'zh-overlay': '中譯疊加', 'data-add': '資料新增',
              '維持照印': '維持照印', '不成立': '不成立', '維持': '維持' };
const escR = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// C479：D1 `received`＝UTC（`datetime('now')`）→ 顯示台灣時間（+8）；只認「YYYY-MM-DD HH:MM」開頭，其餘原樣（四處同式＝test_tw_time）
function twTime(s){var m=/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(String(s==null?'':s));if(!m)return String(s==null?'':s);var d=new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4]+8,+m[5]));function p(n){return (n<10?'0':'')+n;}return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes());}
// 分界（C479 實證、操作者裁）：有 fid 之列＝`reported` 取自 D1 `received`（UTC）⇒ 換；
//   無 fid 之列（裁決回覆 exported_at 已 +8、夥伴端／站主手寫）＝已是台灣時間 ⇒ 不換；
//   快車道撤回列 `YYYY-MM-DDTHH:MM`（站主機當地時鐘）與只有日期之列＝twTime 不認 ⇒ 原樣。
const repShown = r => (r.fid != null && r.fid !== '' ? twTime(r.reported) : String(r.reported || '')).slice(0, 16);
fetch('data/revisions.json').then(r => r.json()).then(d => {
  const tb = document.getElementById('revbody');
  const revs = (d.revisions || []).slice().sort((a, b) =>
    repShown(b).localeCompare(repShown(a)) || ((b.rid || 0) - (a.rid || 0)));
  if (!revs.length) {
    tb.innerHTML = '<tr><td colspan="6" class="pending">尚無修訂紀錄。</td></tr>';
    return;
  }
  tb.innerHTML = revs.map(r => {
    const keep = (r.action === '維持照印' || r.action === '不成立' || r.action === '維持');
    return `<tr>
      <td class="nowrap">${escR(repShown(r))}</td>
      <td><a href="entry.html?id=${encodeURIComponent(r.id || '')}">${escR(r.id)}</a></td>
      <td class="issue">${escR(r.issue)}</td>
      <td>${escR(r.reporter || '—')}</td>
      <td class="ai">${r.ai ? escR(r.ai) : '—'}</td>
      <td><span class="actchip${keep ? ' keep' : ''}">${escR(ACT[r.action] || r.action || '')}</span> ${escR(r.resolution)}</td>
    </tr>`;
  }).join('');
}).catch(() => {
  document.getElementById('revbody').innerHTML =
    '<tr><td colspan="6" class="pending">載入失敗。</td></tr>';
});
</script>
</body>
</html>
